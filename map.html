let savedEdits = getSavedEdits();

locations.forEach(loc => {
  loc.originalQuota = Number(loc.originalQuota ?? loc.quota ?? 0);
  if (Object.prototype.hasOwnProperty.call(savedEdits, loc.id)) {
    loc.quota = Number(savedEdits[loc.id]);
  } else {
    loc.quota = Number(loc.quota || 0);
  }
});

const map = L.map('map', { preferCanvas: true }).setView([13.5, 101.0], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: 13,
  maxClusterRadius: 45
});

const bounds = [];
const markers = [];
const markerById = {};
let missing = 0;

function createIcon(quota) {
  const color = getColor(quota);
  return L.divIcon({
    className: '',
    html: `<div class="quota-marker" style="background:${color}">${quota}</div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -14]
  });
}

function popupHtml(loc) {
  return `
    <div class="popup-box">
      <b>${loc.id}. ${loc.name}</b><br>
      โควต้าเดิม: <b>${loc.originalQuota}</b><br>
      โควต้าปัจจุบัน:
      <input id="quota-input-${loc.id}" class="quota-input" type="number" min="0" step="1" value="${loc.quota}" />
      <br>
      พิกัด: ${Number(loc.lat).toFixed(6)}, ${Number(loc.lng).toFixed(6)}<br>
      <button class="popup-btn" onclick="saveQuota(${loc.id})">บันทึก</button>
      <button class="popup-btn reset" onclick="resetQuota(${loc.id})">คืนค่าเดิม</button>
    </div>
  `;
}

function updateMarker(marker) {
  const loc = marker._quotaData;
  marker.setIcon(createIcon(loc.quota));
  marker.setPopupContent(popupHtml(loc));
}

function refreshSummary() {
  const totalQuota = locations.reduce((sum, x) => sum + Number(x.quota || 0), 0);
  const editedCount = locations.filter(x => Number(x.quota) !== Number(x.originalQuota)).length;

  document.getElementById('totalPlaces').textContent = locations.length;
  document.getElementById('totalQuota').textContent = totalQuota;
  document.getElementById('shownPlaces').textContent = bounds.length;
  document.getElementById('missingPlaces').textContent = missing;
  document.getElementById('editedPlaces').textContent = editedCount;

  const summary = {};
  locations.forEach(x => {
    const q = Number(x.quota || 0);
    summary[q] = (summary[q] || 0) + 1;
  });

  const legend = document.getElementById('legend');
  legend.innerHTML =
    '<b>สีตามจำนวนโควต้า</b><br>' +
    '<div><span class="swatch" style="background:#000000"></span>0 โควต้า: สีดำ</div>' +
    '<div><span class="swatch" style="background:#16a34a"></span>1 โควต้า: สีเขียว</div>' +
    '<div><span class="swatch" style="background:#2563eb"></span>2 โควต้า: สีน้ำเงิน</div>' +
    '<div><span class="swatch" style="background:#f97316"></span>3-4 โควต้า: สีส้ม</div>' +
    '<div><span class="swatch" style="background:#dc2626"></span>5+ โควต้า: สีแดง</div>' +
    '<hr style="border:none;border-top:1px solid #ddd;">' +
    Object.keys(summary).sort((a,b) => Number(a)-Number(b)).map(q =>
      `<div><span class="swatch" style="background:${getColor(Number(q))}"></span>${q} โควต้า: ${summary[q]} แห่ง</div>`
    ).join('');
}

function saveQuota(id) {
  const marker = markerById[id];
  if (!marker) return;

  const loc = marker._quotaData;
  const input = document.getElementById(`quota-input-${id}`);
  let newQuota = Number(input.value);

  if (!Number.isFinite(newQuota) || newQuota < 0) {
    alert('กรุณาใส่จำนวนโควต้าเป็นตัวเลข 0 ขึ้นไป');
    return;
  }

  newQuota = Math.floor(newQuota);
  loc.quota = newQuota;

  savedEdits = getSavedEdits();
  if (Number(loc.quota) === Number(loc.originalQuota)) {
    delete savedEdits[id];
  } else {
    savedEdits[id] = loc.quota;
  }
  saveEdits(savedEdits);

  updateMarker(marker);
  refreshSummary();
  searchPlace(false);
}

function resetQuota(id) {
  const marker = markerById[id];
  if (!marker) return;

  const loc = marker._quotaData;
  loc.quota = Number(loc.originalQuota);

  savedEdits = getSavedEdits();
  delete savedEdits[id];
  saveEdits(savedEdits);

  updateMarker(marker);
  marker.openPopup();
  refreshSummary();
  searchPlace(false);
}

function resetAllQuotas() {
  if (!confirm('ต้องการล้างค่าโควต้าที่แก้ไขทั้งหมด และกลับไปใช้ค่าจากไฟล์เดิมหรือไม่?')) return;

  localStorage.removeItem(STORAGE_KEY);
  savedEdits = {};

  markers.forEach(marker => {
    marker._quotaData.quota = Number(marker._quotaData.originalQuota);
    updateMarker(marker);
  });

  refreshSummary();
  searchPlace(false);
}

locations.forEach(loc => {
  if (typeof loc.lat !== 'number' || typeof loc.lng !== 'number' || isNaN(loc.lat) || isNaN(loc.lng)) {
    missing++;
    return;
  }

  const marker = L.marker([loc.lat, loc.lng], { icon: createIcon(loc.quota) });
  marker.bindPopup(popupHtml(loc));
  marker._quotaData = loc;

  markers.push(marker);
  markerById[loc.id] = marker;
  bounds.push([loc.lat, loc.lng]);
  cluster.addLayer(marker);
});

map.addLayer(cluster);

if (bounds.length > 0) {
  map.fitBounds(bounds, { padding: [35, 35] });
}

function searchPlace(clearWhenEmpty = true) {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const box = document.getElementById('searchResults');

  if (!keyword) {
    if (clearWhenEmpty) box.innerHTML = '';
    return;
  }

  box.innerHTML = '';

  const results = markers
    .filter(m => m._quotaData.name.toLowerCase().includes(keyword))
    .slice(0, 40);

  if (results.length === 0) {
    box.innerHTML = '<div class="result-item">ไม่พบข้อมูล</div>';
    return;
  }

  results.forEach(marker => {
    const loc = marker._quotaData;
    const div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = `${loc.id}. ${loc.name} <b>(${loc.quota})</b>`;
    div.onclick = () => {
      cluster.zoomToShowLayer(marker, () => {
        map.setView(marker.getLatLng(), 15);
        marker.openPopup();
      });
    };
    box.appendChild(div);
  });
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') searchPlace();
});

function downloadEditedJSON() {
  const data = locations.map(loc => ({
    id: loc.id,
    name: loc.name,
    originalQuota: loc.originalQuota,
    quota: loc.quota,
    edited: Number(loc.quota) !== Number(loc.originalQuota),
    lat: loc.lat,
    lng: loc.lng
  }));

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'quota2569_edited.json';
  a.click();
  URL.revokeObjectURL(url);
}

function downloadEditedCSV() {
  const header = ['id','name','originalQuota','quota','edited','lat','lng'];
  const rows = locations.map(loc => [
    loc.id,
    `"${String(loc.name).replaceAll('"','""')}"`,
    loc.originalQuota,
    loc.quota,
    Number(loc.quota) !== Number(loc.originalQuota) ? 'yes' : 'no',
    loc.lat,
    loc.lng
  ].join(','));

  const csv = '\ufeff' + header.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'quota2569_edited.csv';
  a.click();
  URL.revokeObjectURL(url);
}

refreshSummary();
